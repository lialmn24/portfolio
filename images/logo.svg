<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8b4a6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6ec6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#logoGradient)" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.5" filter="url(#glow)"/>
  
  <!-- Text: JULIA -->
  <text x="100" y="85" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#logoGradient)" text-anchor="middle" filter="url(#glow)">
    JULIA
  </text>
  
  <!-- Text: ALEMANIA -->
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#logoGradient)" text-anchor="middle" filter="url(#glow)">
    ALEMANIA
  </text>
  
  <!-- Decorative line -->
  <line x1="50" y1="95" x2="150" y2="95" stroke="url(#logoGradient)" stroke-width="1" opacity="0.6"/>
</svg>
